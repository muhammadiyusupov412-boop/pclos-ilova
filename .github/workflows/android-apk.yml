name: Android APK va veb-versiya
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PCLOS-Baholash.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PCLOS-Baholash-apk
          path: PCLOS-Baholash.apk
      # Telefondan oson yuklab olish uchun: Releases sahifasida "latest" ga APK qo'yiladi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PCLOS Baholash (oxirgi versiya)
          prerelease: false
          make_latest: true
          files: PCLOS-Baholash.apk
  pages:
    # iPhone va istalgan brauzer uchun HTTPS veb-versiya (GPS ishlashi uchun HTTPS kerak)
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: d
        uses: actions/deploy-pages@v4
