<style>
/* Layout: phone-first single column, iOS-style form screens, bottom tab bar; cards only for results */
:root{

  --primary:#2B4BF2; --primary-ink:#FFFFFF; --primary-soft:#E6EAFF;

  --pos:#C0392B; --neg:#2B6CB0;

  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F17; --surface:#171A25; --ink:#ECEEF6; --muted:#9BA2B6; --line:#2B3040; --soft:#1F2330;
  --primary:#6C83FF; --primary-ink:#0D0F17; --primary-soft:#232A4D;
  --gA:#33B06A; --gB:#8FD06B; --gC:#F2D33A; --gD:#F5A93A; --gE:#F06450; --gF:#D25050;
  --pos:#F07A6C; --neg:#6FA8E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F17; --surface:#171A25; --ink:#ECEEF6; --muted:#9BA2B6; --line:#2B3040; --soft:#1F2330;
  --primary:#6C83FF; --primary-ink:#0D0F17; --primary-soft:#232A4D;
  --gA:#33B06A; --gB:#8FD06B; --gC:#F2D33A; --gD:#F5A93A; --gE:#F06450; --gF:#D25050;
  --pos:#F07A6C; --neg:#6FA8E8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{font-size:20px;font-weight:500;margin:2px 0 0;color:var(--ink)}
h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);font:600 12px var(--font);padding:6px 9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:700;font-size:15px}
.lblrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;font:500 16px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:11px 12px;min-height:46px;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px var(--font);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-size:17px;letter-spacing:.04em;text-transform:uppercase;min-height:50px;width:100%}
.btn.ghost{background:none}
.btn.danger{color:var(--gE);border-color:color-mix(in srgb,var(--gE) 40%,var(--line))}
.btn.sm{min-height:36px;padding:7px 11px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 auto}
.group{margin-top:26px;display:flex;flex-direction:column;gap:14px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px}
.ghead h2{font-size:17px}
.code{font:600 12px var(--font);color:var(--muted);letter-spacing:.04em}
.pi{font:600 12px var(--font);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pi.s1{background:color-mix(in srgb,var(--gA) 16%,var(--surface));color:var(--gA)}
.pi.s05{background:color-mix(in srgb,var(--gC) 20%,var(--surface));color:color-mix(in srgb,var(--gC) 70%,var(--ink))}
.pi.s0{background:color-mix(in srgb,var(--gE) 14%,var(--surface));color:var(--gE)}
.info{border:0;background:none;color:var(--primary);font:600 13px var(--font);padding:2px 0;cursor:pointer}
.std{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:9px 11px}
.progress{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .2s}
.result{border:2px solid var(--primary);border-radius:10px;background:var(--surface);padding:14px 16px;display:flex;align-items:center;gap:14px}
.result .walker{width:44px;height:44px;flex:none;color:var(--primary)}
.result .big{font-size:30px;font-weight:800;letter-spacing:-.01em;flex:1}
.pill{background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:24px;border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;font-weight:800;color:#fff;font-size:17px;flex:none}
.bA{background:var(--gA)}.bB{background:var(--gB)}.bC{background:var(--gC)}.bD{background:var(--gD)}.bE{background:var(--gE)}.bF{background:var(--gF)}
ul.recs{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.recs li b{font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .meta{flex:1;min-width:0}
.item .name{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.item .meta{cursor:pointer}
.ibtn{width:36px;height:36px;padding:0!important;min-height:36px}
.item .pct{font-weight:700;font-variant-numeric:tabular-nums}
.tag{font:600 11px var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px}
.section{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.section>p{margin:0}
.chartbox{position:relative;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.chartbox canvas{display:block;width:100%!important}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-weight:700;color:var(--muted);background:var(--surface);position:sticky;top:0}
td.l,th.l{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.hm td{min-width:34px}
.cm td{min-width:30px;padding:4px 3px;font-size:11px}
.cm th{font-size:11px;padding:4px 3px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{border:0;background:none;color:var(--muted);font:600 11px var(--font);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--primary)}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font:600 13px var(--font);color:var(--muted);padding:7px 6px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:40;max-width:90vw}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px}
.formula{font:600 16px var(--font);background:var(--soft);border-radius:8px;padding:12px;text-align:center}
.cfield{width:72px!important;min-height:36px!important;padding:6px 8px!important;font-size:14px!important;text-align:right}
.confirm{display:flex;gap:8px;align-items:center}
@media (max-width:380px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Leaflet 1.9.4 CSS (inlined) */
/* required styles */

.leaflet-pane,

/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);

  s:{uz:"O‘z DSt 3283:2023: 5.16.1/5.16.2 «Piyodalar o‘tish joyi» belgilari (I o‘lcham, 600 mm), svetoforsiz o‘tish oldida 1.20 ogohlantiruvchi belgi, ko‘zi ojizlar o‘tadigan joyda 7.15 lavhasi. Joylashuvi GOST 23457-86, 2.6.22-band bo‘yicha.",en:"O‘z DSt 3283:2023: signs 5.16.1/5.16.2 “Pedestrian crossing” (size I, 600 mm), warning sign 1.20 before unsignalized crossings, plate 7.15 where blind pedestrians cross. Placement per GOST 23457-86 cl. 2.6.22.",ru:"O‘z DSt 3283:2023: знаки 5.16.1/5.16.2 «Пешеходный переход» (типоразмер I, 600 мм), знак 1.20 перед нерегулируемым переходом, табличка 7.15 где переходят слепые. Установка по ГОСТ 23457-86, п. 2.6.22."},
  r:{uz:"5.16.1 / 5.16.2 (kerak bo‘lsa 1.20) belgilarini O‘z DSt 3283:2023 bo‘yicha o‘rnatish",en:"Install signs 5.16.1/5.16.2 (and 1.20 if needed) per O‘z DSt 3283:2023",ru:"Установить знаки 5.16.1/5.16.2 (и 1.20) по O‘z DSt 3283:2023"}},
 {c:"P10",ci:4.75,crf:45,src:"IIHS 2026 (Fitzpatrick et al. 2021): pedestrian hybrid beacon −45% injury/fatal pedestrian crashes; FHWA toolbox CMF 0.45 (ID 9020)",n:{uz:"Piyodalar svetofori",en:"Pedestrian signal",ru:"Пешеходный светофор"},o:std3(),
  s:{uz:"GOST 23457-86: rostlanadigan chorrahadagi barcha o‘tishlarda piyoda svetofori shart (4.31), yashil ishora o‘chishidan oldin 3 s miltillaydi (4.35), svetofor o‘tish chegarasidan 1 m dan uzoq emas (4.21). Svetoforsiz joyda svetofor kerak, agar 8 soat davomida asosiy yo‘lda ≥600 avt/soat (ajratuvchi tasmali yo‘lda ≥1000) va ≥150 piyoda/soat bo‘lsa (4.14). O‘zMSt 349:2024: ovozli va taktil ishora (F-ilova).",en:"GOST 23457-86: every crossing at a signalized intersection needs a pedestrian signal (4.31), green flashes 3 s before ending (4.35), signal within 1 m of the crossing (4.21). An unsignalized site warrants a signal at ≥600 veh/h on the major road (≥1000 with a median) and ≥150 ped/h for 8 h (4.14). O‘zMSt 349:2024: audible and tactile signals (Annex F).",ru:"ГОСТ 23457-86: все переходы на регулируемом перекрёстке — с пешеходными светофорами (4.31), мигание зелёного 3 с (4.35), не далее 1 м от перехода (4.21). На нерегулируемом светофор нужен при ≥600 авт./ч (≥1000 с разделительной) и ≥150 пеш./ч в течение 8 ч (4.14). O‘zMSt 349:2024: звуковая и тактильная сигнализация (прил. F)."},
  r:{uz:"Piyoda svetoforini o‘rnatish yoki ta’mirlash: 3 s miltillash, taymer, ovozli ishora (GOST 23457-86, O‘zMSt 349:2024)",en:"Install or repair the pedestrian signal: 3 s flashing green, countdown, audible signal",ru:"Установить или отремонтировать пешеходный светофор: мигание 3 с, табло, звук"}},
 {c:"P11",ci:2.92,crf:23,src:"FHWA-SA-18-041: overhead lighting, injury crashes, CMF 0.77 (CMF ID 199)",n:{uz:"Yo‘l (ko‘cha)ning yoritilishi",en:"Additional lighting",ru:"Дополнительное освещение"},

  r:{uz:"O‘tish joyi va yaqinlashishini O‘z DSt 3644:2023 bo‘yicha yoritish (tunda ≥10 lx, 60 km/soatda 75 m)",en:"Light the crossing and approaches per O‘z DSt 3644:2023 (≥10 lx at night, 75 m at 60 km/h)",ru:"Осветить переход и подходы по O‘z DSt 3644:2023 (ночью ≥10 лк, 75 м при 60 км/ч)"}},
 {c:"P12",ci:1.25,crf:3,src:"FHWA-SA-18-041: pavement friction (skid overlay), CMF 0.97",n:{uz:"Qoplamaning tishlashish koeffitsienti",en:"Skid resistance",ru:"Шероховатость покрытия"},o:[{v:1,uz:"Tishlashish yaxshi (≥0,3), sirpanchiq emas",en:"Good friction (≥0.3), not slippery",ru:"Хорошее сцепление (≥0,3)"},{v:0.5,uz:"Ayrim joylari sirpanchiq / silliqlangan",en:"Some slippery or polished patches",ru:"Местами скользкое / отполированное"},{v:0,uz:"Sirpanchiq qoplama (<0,3)",en:"Slippery surface (<0.3)",ru:"Скользкое покрытие (<0,3)"}],
  s:{uz:"GOST R 50597-93, 3.1.4: qoplamaning tishlashish koeffitsienti kamida 0,3 bo‘lishi kerak (PKRS-2 asbobida). 4.2.6: yo‘l chizig‘ining tishlashish koeffitsienti qoplamanikining kamida 0,75 qismi. Lug‘at: tishlashish koeffitsienti 0,3 dan kichik yo‘l bo‘lagi – sirpanchiq yo‘l.",en:"GOST R 50597-93 cl. 3.1.4: pavement friction coefficient at least 0.3 (PKRS-2). Cl. 4.2.6: marking friction at least 0.75 of the pavement value.",ru:"ГОСТ Р 50597-93, п. 3.1.4: коэффициент сцепления покрытия не менее 0,3 (ПКРС-2). П. 4.2.6: сцепление разметки не менее 0,75 от покрытия."},
  r:{uz:"Qoplamada g‘adir-budirlik hosil qilish (sirt ishlov berish) – tishlashish koeffitsienti ≥0,3",en:"Restore surface texture so friction is ≥0.3",ru:"Устроить шероховатость, сцепление ≥0,3"}},
 {c:"P13",ci:1.0,crf:0,src:"CMF yo‘q / no pedestrian CMF",n:{uz:"Yo‘ldan suv ketkazish qurilmasi",en:"Drainage",ru:"Водоотвод"},

 {c:"P14",ci:1.0,crf:0,src:"CMF yo‘q / no pedestrian CMF",n:{uz:"Yo‘l qoplamasining holati",en:"Surface standard",ru:"Состояние покрытия"},
  o:[{v:1,uz:"Ravon, o‘nqir-cho‘nqirsiz",en:"Even, no potholes",ru:"Ровное, без выбоин"},{v:0.5,uz:"Mayda nuqsonlar, me’yor chegarasida",en:"Minor defects within limits",ru:"Мелкие дефекты в пределах нормы"},{v:0,uz:"O‘nqir-cho‘nqir me’yordan katta",en:"Potholes beyond limits",ru:"Выбоины сверх нормы"}],

  r:{uz:"O‘nqir-cho‘nqir va cho‘kishlarni ta’mirlash (GOST R 50597-93 chegaralari)",en:"Repair potholes and subsidence (GOST R 50597-93 limits)",ru:"Устранить выбоины и просадки (пределы ГОСТ Р 50597-93)"}},
 {c:"P15",ci:1.0,crf:0,src:"CMF yo‘q (foydalanish imkoniyati talabi) / no CMF (accessibility requirement)",n:{uz:"Hoshiya (bordyur) pandusi",en:"Dropped curb / curb ramp",ru:"Пандус / понижение бордюра"},o:std3(),
  s:{uz:"SHNQ 2.07.02-22, 17-band va 9-ilova: piyodalar yo‘lkasi piyodalar o‘tish joyi bilan pandus orqali tutashadi; pandus kengligi kamida 1,0 m, bo‘ylama qiyaligi 1:12 (8%), ko‘ndalang qiyaligi 1:50; balandlik farqi 0,2 m va kam bo‘lsa qiyalik 10% gacha.",en:"SHNQ 2.07.02-22 cl. 17 and Annex 9: the sidewalk joins the crossing by a ramp at least 1.0 m wide, slope 1:12 (8%), cross slope 1:50; up to 10% where the drop is 0.2 m or less.",ru:"ШНК 2.07.02-22, п. 17 и прил. 9: тротуар сопрягается с переходом пандусом шириной не менее 1,0 м, уклон 1:12 (8%), поперечный 1:50; при перепаде до 0,2 м — до 10%."},
  r:{uz:"Kengligi kamida 1,0 m, qiyaligi 1:12 hoshiya pandusini qurish (SHNQ 2.07.02-22)",en:"Build a curb ramp ≥1.0 m wide at 1:12 (SHNQ 2.07.02-22)",ru:"Устроить пандус шириной ≥1,0 м с уклоном 1:12 (ШНК 2.07.02-22)"}},
 {c:"P16",ci:1.0,crf:0,src:"CMF yo‘q (foydalanish imkoniyati talabi) / no CMF (accessibility requirement)",n:{uz:"Taktil qoplama",en:"Tactile paving",ru:"Тактильная плитка"},o:std3(),
  s:{uz:"SHNQ 2.07.02-22, 7, 23 va 48-bandlar: piyodalar o‘tish joyiga yaqinlashishda yo‘lak qoplamasi taktil va kontrast rangli bo‘lishi; pandus va zinalardan 0,6 m oldin ogohlantiruvchi taktil qoplama (3, 4, 6, 17–19-ilovalar). O‘zMSt 349:2024, F-ilova: svetoforli o‘tishda ovozli va taktil ishora.",en:"SHNQ 2.07.02-22 cl. 7, 23, 48: tactile and contrasting paving on approaches to crossings; warning tactile strip 0.6 m before ramps and steps (Annexes 3, 4, 6, 17–19). O‘zMSt 349:2024 Annex F: audible and tactile signals.",ru:"ШНК 2.07.02-22, п. 7, 23, 48: тактильное контрастное покрытие на подходах к переходу; предупреждающая полоса за 0,6 м до пандусов и лестниц (прил. 3, 4, 6, 17–19). O‘zMSt 349:2024, прил. F: звуковая и тактильная сигнализация."},
  r:{uz:"O‘tish joyiga yaqinlashishda kontrast rangli taktil qoplama yotqizish (SHNQ 2.07.02-22)",en:"Lay contrasting tactile paving on the approaches (SHNQ 2.07.02-22)",ru:"Уложить контрастное тактильное покрытие на подходах (ШНК 2.07.02-22)"}},

  o:[{v:1,uz:"Taqiq bor va bajariladi (o‘tish joyidan ≥10 m, chorrahada ≥30 m)",en:"Ban in place and observed (≥10 m from crossing, ≥30 m at junction)",ru:"Запрет есть и соблюдается (≥10 м от перехода, ≥30 м у перекрёстка)"},{v:0.5,uz:"Taqiq bor, lekin buziladi yoki masofa kam",en:"Ban exists but violated or distance short",ru:"Запрет есть, но нарушается или расстояние меньше"},{v:0,uz:"Avtomobillar o‘tish joyida yoki yonida turadi",en:"Vehicles stop on or next to the crossing",ru:"Автомобили стоят на переходе или рядом"}],

  r:{uz:"O‘tish joyidan 10 m (chorrahada 30 m) oralig‘ida to‘xtashni 3.27 belgisi / 1.4 chizig‘i bilan taqiqlash va nazorat qilish",en:"Ban stopping within 10 m (30 m at junctions) with sign 3.27 / marking 1.4 and enforce it",ru:"Запретить остановку в 10 м (у перекрёстка 30 м) знаком 3.27 / разметкой 1.4 и контролировать"}}

const KEY="pclos-app-v1";

function blankDraft(){return {method:"ahmed",id:null,name:"",type:"x4",control:"",date:new Date().toISOString().slice(0,10),lat:"",lon:"",speed:"",width:"",lanes:"",scores:{}}}
function load(){
  let s=null; try{s=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(!s){s={lang:"uz",theme:"auto",likert:{},sites:SAMPLE.map((x,i)=>mkSample(x,i)),draft:blankDraft(),tab:"assess",showResult:false}}
  s.draft = s.draft || blankDraft(); s.likert = s.likert||{}; s.sites=s.sites||[];
  s.method="ahmed"; if(!s.cutsBy){s.cutsBy={}; if(Array.isArray(s.cuts)) s.cutsBy.ahmed=s.cuts} 
  s.sites.forEach(x=>{if(!x.method) x.method=methodOf(x)}); if(!s.draft.method) s.draft.method=s.method;
  s.sites=s.sites.filter(x=>!(x.sample&&methodOf(x)==="uz"));
  return s;
}
function mkSample(x,i){const sc={};IND_AH.forEach((d,j)=>sc[d.c]=x[2][j]);return {method:"ahmed",id:"s"+i+Date.now().toString(36),name:x[0],type:x[1],date:"2021-08-20",lat:"",lon:"",sample:true,scores:sc}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const t = k => (T[S.lang]&&T[S.lang][k]) ?? T.uz[k] ?? k;
const L = o => o[S.lang] ?? o.uz;
const crfOf=c=>{const v=parseFloat(String((S.crfLocal||{})[c]??"").replace(",",".")); return isFinite(v)&&v>=0&&v<100?v:(BYC[c].crf||0)};
const crfMax=()=>Math.max(...IND_AH.map(d=>crfOf(d.c)),1);
const ciOf = c => +(1+4*crfOf(c)/crfMax()).toFixed(2);
const ideal = () => IND.reduce((a,d)=>a+ciOf(d.c),0);
/* Hal qiluvchi talablar: biri buzilsa daraja D dan yuqori bo‘lmaydi */
function critFails(site){const sc=site.scores||{}, f=[]; if(sc.P01===0) f.push("P01"); if(sc.P10===0) f.push("P10"); if(sc.P02===0) f.push("P02"); return f}
function compute(site){
  const m=methodOf(site), list=METHODS[m].ind;
  let sum=0,n=0,id=0; list.forEach(d=>{const p=site.scores[d.c]; if(p===-1){n++;return} id+=ciOf(d.c); if(p!==undefined&&p!==null&&p!==""){n++; sum+=ciOf(d.c)*p}});
  const pct= id>0? sum/id*100 : 0; let grade=gradeOf(pct,m); const crit=critFails(site); if(crit.length&&"ABC".includes(grade)) grade="D";
  return {sum,ideal:id,pct,grade,answered:n,total:list.length,crit};
}
const fmt=(x,d=2)=> (x==null||!isFinite(x))?"—":Number(x).toLocaleString(S.lang==="en"?"en-US":S.lang==="ru"?"ru-RU":"uz-UZ",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}

function autoScore(kind,val){
  const x=parseFloat(String(val).replace(",",".")); if(!isFinite(x)) return;
  if(S.method==="uz"){ if(kind==="speed") S.draft.scores.U01=x<=60?1:0; if(kind==="width"){const W=Math.max(4,(numv(S.draft.peds)||0)/500); S.draft.scores.U02=x>=W-1e-9?1:(x>=3?0.5:0)} if(kind==="lanes") S.draft.scores.U03=x<=4?1:(x<=6?0.5:0); return }
  if(kind==="speed") S.draft.scores.P01 = x<=60?1:0;
  if(kind==="width"){const W=Math.max(4,(numv(S.draft.peds)||0)/500); S.draft.scores.P03 = x>=W-1e-9?1:(x>=W-1-1e-9?0.5:0)}

const isSig=c=>c==="sig"||c==="btn"||c==="reg";
const numv=v=>{const x=parseFloat(String(v??"").replace(",","."));return isFinite(x)?x:null};
const LOS_SIG_DELAY=[10,20,30,40,60], LOS_UNS_DELAY=[5,10,20,30,45], LOS_SCORE=[2.00,2.75,3.50,4.25,5.00];
const losBy=(x,th)=>x==null?null:("ABCDE"[th.findIndex(v=>x<=v)]||"F");
function hcm(d){
  if(!d.control) return null;
  const lanes=numv(d.lanes);
  if(isSig(d.control)){
    const C=numv(d.cycle), g=numv(d.gwalk); if(!C||g==null||g<0||g>C) return {sig:true,ok:false};
    const dp=Math.pow(C-g,2)/(2*C); const out={sig:true,ok:true,delay:dp,los:losBy(dp,LOS_SIG_DELAY)};
    const vt=numv(d.vturn), n15=numv(d.n15), v85=numv(d.v85);
    if(lanes&&vt!=null&&n15!=null&&v85!=null){
      const Fw=0.681*Math.pow(lanes,0.514), Fv=0.00569*(vt/4), Fs=0.00013*n15*(v85/1.609344), Fd=0.0401*Math.log(Math.max(dp,0.1));
      out.score=0.5997+Fw+Fv+Fs+Fd; out.losScore=losBy(out.score,LOS_SCORE);
    }
    return out;
  }
  const v=numv(d.flow); const N=lanes||2; const Lm=numv(d.clen)||(N*3.5); const My=Math.min(Math.max((numv(d.yieldp)||0)/100,0),1);
  if(v==null) return {sig:false,ok:false};
  const tc=Lm/1.07+3; if(v<=0) return {sig:false,ok:true,delay:0,los:"A",tc,pd:0};
  const vs=v/3600, vl=v/N/3600;
  const Pb=1-Math.exp(-tc*vl), Pd=1-Math.pow(1-Pb,N);
  const dg=(Math.exp(vs*tc)-vs*tc-1)/vs, dgd=dg/Pd, h=N/vs;
  const k=(Math.pow(1-Pb+Pb*My,N)-Math.pow(1-Pb,N))/Pd;
  let sumP=0,dp=0; const n=Math.min(Math.floor(dgd/h),2000);
  for(let i=1;i<=n;i++){const Py=(Pd-sumP)*k; dp+=h*(i-0.5)*Py; sumP+=Py}
  dp+=(Pd-sumP)*dgd;
  return {sig:false,ok:true,delay:dp,los:losBy(dp,LOS_UNS_DELAY),tc,pd:Pd};
}

function autoNA(){
  const d=S.draft, lanes=numv(d.lanes), L=numv(d.clen)||(lanes?lanes*3.5:null); d.autoNA=d.autoNA||{};
  const setNA=(c,cond)=>{ if(cond){ if(d.scores[c]===undefined||d.autoNA[c]){d.scores[c]=-1;d.autoNA[c]=1} } else if(d.autoNA[c]){delete d.scores[c];delete d.autoNA[c]} };
  if(methodOf(d)==="uz"){autoNAuz(d,lanes,L,setNA);return}
  const uns=d.control==="uns", flow=numv(d.flow), peds=numv(d.peds);
  setNA("P05", uns);
  setNA("P10", uns&&flow!=null&&(flow<600||(peds!=null&&peds<150)));
  setNA("P08", (L!=null&&L<15)||(uns&&flow!=null&&lanes&&flow/lanes<400));
  if(sigWarrant(d)){ if(d.scores.P10===undefined||d.autoNA.P10){d.scores.P10=0; d.autoNA.P10=2} } else if(d.autoNA.P10===2){delete d.scores.P10; delete d.autoNA.P10}
}
function autoNAuz(d,lanes,L,setNA){
  const uns=d.control==="uns", flow=numv(d.flow), peds=numv(d.peds);
  // GOST 23457-86 4.14: svetofor talab qilinmaydi
  setNA("U06", uns&&flow!=null&&(flow<600||(peds!=null&&peds<150)));
  // GOST 23457-86 5.3.5: orolcha talab qilinmaydi
  setNA("U11", (L!=null&&L<15)||(uns&&flow!=null&&lanes&&flow/lanes<400));
  // svetofor kerak, lekin yo‘q -> U06 = 0
  if(sigWarrant(d)){ if(d.scores.U06===undefined||d.autoNA.U06){d.scores.U06=0; d.autoNA.U06=2} } else if(d.autoNA.U06===2){delete d.scores.U06; delete d.autoNA.U06}
}
function sigWarrant(d){const f=numv(d.flow),p=numv(d.peds); return d.control==="uns"&&f!=null&&p!=null&&f>=600&&p>=150}
function autoWait(){
  const d=S.draft; if(methodOf(d)!=="uz") return; let w=null;
  if(d.control&&isSig(d.control)){const C=numv(d.cycle),g=numv(d.gwalk); if(C&&g!=null&&g>=0&&g<=C) w=C-g}
  else if(d.control){const h=hcm(d); if(h&&h.ok) w=h.delay}
  if(w==null){ if(d.autoW){delete d.scores.U04; d.autoW=0} return }
  if(d.scores.U04===undefined||d.autoW){ d.scores.U04= w<45?1:(w<=60?0.5:0); d.autoW=1 }
}

/* ---------- Statistika ---------- */
function pearson(a,b){const n=a.length; if(n<3) return NaN; const ma=a.reduce((x,y)=>x+y,0)/n, mb=b.reduce((x,y)=>x+y,0)/n; let sab=0,saa=0,sbb=0; for(let i=0;i<n;i++){const da=a[i]-ma,db=b[i]-mb; sab+=da*db; saa+=da*da; sbb+=db*db} return (saa<1e-12||sbb<1e-12)?NaN:sab/Math.sqrt(saa*sbb)}
function linreg(x,y){const n=x.length; const mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n; let sxy=0,sxx=0; for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my); sxx+=(x[i]-mx)**2} if(sxx<1e-12) return null; const b=sxy/sxx; return {a:my-b*mx,b}}
const piOf=(s,c)=>{const v=s.scores[c]; return v===-1?1:(v??0)}; /* N/A: kamchilik yo‘q deb olinadi */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function mix(c1,c2,w){/* w: 0..1 share of c1, hex only */ const h=x=>x.replace("#",""); const a=h(c1),b=h(c2); const p=i=>Math.round(parseInt(a.substr(i,2),16)*w+parseInt(b.substr(i,2),16)*(1-w)).toString(16).padStart(2,"0"); return "#"+p(0)+p(2)+p(4)}
function scoreColor(v){const s=css("--surface"); return v===1?mix(css("--gA"),s,.55):v===0.5?mix(css("--gC"),s,.55):mix(css("--gE"),s,.45)}
function corrColor(r){if(!isFinite(r)) return "transparent"; const s=css("--surface"); return r>=0?mix(css("--pos"),s,Math.min(1,Math.abs(r))*.75):mix(css("--neg"),s,Math.min(1,Math.abs(r))*.75)}
function gradeColor(g){return css("--g"+g)}
function chartDefaults(){
  if(!window.Chart) return false;
  Chart.defaults.font.family=css("--font")||"Inter, sans-serif"; Chart.defaults.font.size=11;
  Chart.defaults.color=css("--muted"); Chart.defaults.borderColor=css("--line");
  Chart.defaults.plugins.legend.labels.boxWidth=10; Chart.defaults.maintainAspectRatio=false; Chart.defaults.animation=matchMedia("(prefers-reduced-motion: reduce)").matches?false:{duration:350};
  return true;
}
const shortName=(s,n=22)=>{const x=s.name||"—";return x.length>n?x.slice(0,n-1)+"…":x};

    return [a.road||a.pedestrian||a.neighbourhood, a.suburb||a.city_district||a.city||a.town].filter(Boolean).join(", ");
  }catch(e){return ""}
}
async function locate(auto){
  const d=S.draft; const key=d.id||"new";
  if(auto){ if(d.lat||gps.tried===key) return; }
  gps.tried=key; gps.state="wait"; setGpsStatus();
  try{
    const c=await getPosition();
    if(S.draft!==d) return;
    d.lat=c.latitude.toFixed(6); d.lon=c.longitude.toFixed(6); gps.acc=c.accuracy; gps.state="ok"; save();
    const la=document.getElementById("f-lat"), lo=document.getElementById("f-lon"); if(la){la.value=d.lat; lo.value=d.lon}
    setGpsStatus();
    if(!d.name||!d.region){const nm=await reverseName(d.lat,d.lon); if(nm&&!S.draft.name&&S.draft===d){d.name=nm; save(); const f=document.getElementById("f-name"); if(f) f.value=nm}}
  }catch(e){ gps.state= auto?"idle":"fail"; setGpsStatus(); if(!auto) toast(t("gpsFail")) }
}

  const b=e.target.closest("button"); if(!b) return;

  if(b.dataset.method){ if(S.method!==b.dataset.method){setMethod(b.dataset.method); if(!S.draft.id){const keep=S.draft; S.draft=blankDraft(); ["name","region","district","village","control","type","date","lat","lon","speed","width","lanes","cycle","gwalk","vturn","n15","v85","flow","yieldp","clen","walk","vdes","peds"].forEach(k=>{if(keep[k]!==undefined)S.draft[k]=keep[k]}); S.draft.method=S.method; autoScoreAll()} else {S.draft=blankDraft()} S.showResult=false; save(); render()} return}
  if(b.dataset.mapby){S.mapBy=b.dataset.mapby;save();render();return}
  if(b.dataset.preset){S.cutsBy[S.method]=CUT_PRESETS[b.dataset.preset].slice();save();render();return}
  if(b.dataset.themeSet){S.theme=b.dataset.themeSet;save();applyTheme();render();return}
  switch(b.id){
    case "btn-calc": S.showResult=true; save(); document.getElementById("result-area").innerHTML=resultHTML(S.draft); document.getElementById("result-card").scrollIntoView({behavior:"smooth",block:"center"}); return;
    case "btn-save": { const d=JSON.parse(JSON.stringify(S.draft)); if(!d.name) d.name=t("site")+" "+(S.sites.length+1);
      if(d.id){const i=S.sites.findIndex(s=>s.id===d.id); if(i>=0){S.sites[i]=d}else S.sites.push(d); toast(t("updated"))} else {d.id="u"+Date.now().toString(36); S.sites.push(d); toast(t("saved"))}
      S.draft=blankDraft(); gps.state="idle"; S.showResult=false; save(); render(); window.scrollTo(0,0); return;}
    case "btn-new": S.draft=blankDraft(); gps.state="idle"; gps.tried=null; S.showResult=false; save(); render(); window.scrollTo(0,0); return;
    case "btn-gps": locate(false); return;
    case "btn-photo": document.getElementById("filePhoto").click(); return;
    case "btn-sample": SAMPLE.forEach((x,i)=>S.sites.push(mkSample(x,i))); save(); render(); return;
    case "btn-impx": document.getElementById("fileXlsx").click(); return;
    case "btn-impj": document.getElementById("fileJson").click(); return;
    case "btn-expj": (async()=>{const files=[{name:"pclos_zaxira.json",data:JSON.stringify({sites:S.sites,crfLocal:S.crfLocal||{}},null,1)}]; for(const s of S.sites) for(const k of (s.photos||[])){try{const bl=await PDB.get(k); if(bl) files.push({name:"photos/"+k+".jpg",data:new Uint8Array(await bl.arrayBuffer())})}catch(e){}}
      deliverFile("PCLOS_zaxira_"+new Date().toISOString().slice(0,10)+".zip",u8b64(makeZip(files)),"application/zip")})(); return;
    case "btn-xlsx": exportXlsx(); return;
    case "btn-geojson": if(gisGuard()) deliverFile("PCLOS_baholash.geojson",b64utf8(geojsonText()),"application/geo+json"); return;
    case "btn-kml": if(gisGuard()) deliverFile("PCLOS_baholash.kml",b64utf8(kmlText()),"application/vnd.google-earth.kml+xml"); return;
    case "btn-giszip": if(gisGuard()) deliverFile("PCLOS_GIS.zip",u8b64(makeZip([{name:"PCLOS_baholash.geojson",data:geojsonText()},{name:"PCLOS_baholash.kml",data:kmlText()},{name:"PCLOS_baholash.qml",data:qmlText()},{name:"PCLOS_baholash.csv",data:gisCsv()}])),"application/zip"); return;
    case "btn-csv": deliverFile("PCLOS_natijalar.csv",b64utf8("﻿"+toDelim(",")),"text/csv"); return;
    case "btn-copy": try{await navigator.clipboard.writeText(toDelim("\t"));toast(t("copied"))}catch(err){toast(t("dlFail"))} return;
    case "btn-reset": S.likert={}; save(); render(); toast(t("resetDone")); return;
    case "btn-crfreset": S.crfLocal={}; save(); render(); toast(t("resetDone")); return;
    case "btn-svadd": svList().push({r:{}}); save(); render(); return;
    case "btn-svdel": svList().pop(); save(); render(); return;
    case "btn-svapply": IND.forEach(d=>{const m=svMean(d.c); if(m) S.likert[d.c]=m.mean.toFixed(2)}); save(); render(); toast(t("svApplied")); return;
    case "btn-svcsv": deliverFile("Ci_sorovnoma_"+S.method+".csv",b64utf8("\ufeff"+svCsv()),"text/csv"); return;
  }
  if(b.dataset.edit){const s=S.sites.find(x=>x.id===b.dataset.edit); setMethod(methodOf(s)); S.draft=JSON.parse(JSON.stringify(s)); delete S.draft.sample; S.draft.id=s.id; S.draft.speed=S.draft.speed||"";S.draft.width=S.draft.width||"";S.draft.lanes=S.draft.lanes||""; S.showResult=true; S.tab="assess"; save(); render(); window.scrollTo(0,0); return}
  if(b.dataset.del){pendingDel=b.dataset.del; render(); return}
  if(b.dataset.delno){pendingDel=null; render(); return}
  if(b.dataset.phdel){S.draft.photos=(S.draft.photos||[]).filter(x=>x!==b.dataset.phdel); if(!S.sites.some(s=>(s.photos||[]).includes(b.dataset.phdel))) PDB.del(b.dataset.phdel); save(); render(); return}
  if(b.dataset.delyes){ const gone=b.dataset.delyes==="ALL"?S.sites:S.sites.filter(s=>s.id===b.dataset.delyes); gone.forEach(s=>(s.photos||[]).forEach(k=>PDB.del(k))); if(b.dataset.delyes==="ALL") S.sites=[]; else S.sites=S.sites.filter(s=>s.id!==b.dataset.delyes); pendingDel=null; save(); render(); toast(t("deleted")); return}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.hs){S.draft[el.dataset.hs]=el.value; const o=document.getElementById("hcm-out"); if(o)o.innerHTML=hcmOutHTML(S.draft); if(S.showResult){const ra=document.getElementById("result-area"); if(ra) ra.innerHTML=resultHTML(S.draft)} save(); return}
  if(el.dataset&&el.dataset.sv){const [i,c]=el.dataset.sv.split("|"); const v=parseFloat(String(el.value).replace(",",".")); const L=svList(); if(!L[+i]) return; if(isFinite(v)&&v>=1&&v<=5) L[+i].r[c]=v; else {delete L[+i].r[c]; el.value=""} save(); const m=svMean(c); const mc=document.getElementById("svm-"+c); if(mc) mc.textContent=m?fmt(m.mean,2):"–"; const nc=document.getElementById("svn-"+c); if(nc) nc.textContent=m?m.n:0; return}
  if(el.dataset&&el.dataset.crf){S.crfLocal=S.crfLocal||{}; const v=el.value.trim(); if(v==="") delete S.crfLocal[el.dataset.crf]; else S.crfLocal[el.dataset.crf]=v; save(); render(); return}
  if(el.dataset&&el.dataset.code){const c=el.dataset.code; if(S.draft.autoNA) delete S.draft.autoNA[c]; if(c==="U04") S.draft.autoW=0; if(el.value==="") delete S.draft.scores[c]; else S.draft.scores[c]=parseFloat(el.value); updateLive(); return}
  if(el.dataset&&el.dataset.cut!==undefined){const c=cuts().slice(); const v=parseFloat(el.value); if(isFinite(v)){c[+el.dataset.cut]=v; if(c[0]>c[1]&&c[1]>c[2]&&c[2]>c[3]&&c[3]>=c[4]){S.cutsBy[S.method]=c;save();render()} else {el.value=cuts()[+el.dataset.cut]}} return}
  if(el.id==="f-type"){S.draft.type=el.value;save();return}
  if(el.id==="f-region"){S.draft.region=el.value; S.draft.district=""; S.draft.village=""; const box=document.getElementById("adm-box"); if(box) box.innerHTML=admHTML(S.draft); save();return}
  if(el.id==="f-district"){S.draft.district=el.value; S.draft.village=""; const box=document.getElementById("adm-box"); if(box) box.innerHTML=admHTML(S.draft); save();return}
  if(el.id==="f-ctrl"){S.draft.control=el.value;autoWait();autoNA();save();render();return}
  if(el.id==="f-date"){S.draft.date=el.value;save();return}
  if(el.id==="sel-site"){selSite=el.value; render(); requestAnimationFrame(()=>document.getElementById("ch2")?.scrollIntoView({block:"center"})); return}
  if(el.id==="ax-x"||el.id==="ax-y"){ if(el.id==="ax-x") axX=el.value; else axY=el.value; drawScatter(); return}
  if(el.id==="fileXlsx"&&el.files[0]){const f=el.files[0]; f.arrayBuffer().then(buf=>{try{const n=importWorkbook(new Uint8Array(buf)); save(); render(); toast(t("imported")+n)}catch(err){toast(t("importFail"))}}); el.value=""; return}
  if(el.id==="filePhoto"&&el.files.length){const fs=[...el.files]; el.value=""; (async()=>{for(const f of fs){try{const b=await shrinkImage(f); const k="ph"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); await PDB.put(k,b); S.draft.photos=(S.draft.photos||[]).concat(k)}catch(e){toast(t("photoFail"))}} save(); render()})(); return}
  if(el.id==="fileJson"&&el.files[0]&&/\.zip$/i.test(el.files[0].name)){const f=el.files[0]; el.value=""; f.arrayBuffer().then(async buf=>{try{const n=await importBackupZip(new Uint8Array(buf)); save(); render(); toast(t("imported")+n)}catch(e){toast(t("importFail"))}}); return}
  if(el.id==="fileJson"&&el.files[0]){el.files[0].text().then(txt=>{try{const o=JSON.parse(txt); if(Array.isArray(o.sites)){S.sites=S.sites.concat(o.sites.map(s=>({...s,id:(s.id||"j")+Math.random().toString(36).slice(2,6)})))} if(o.likert) S.likert={...S.likert,...o.likert}; save(); render(); toast(t("imported")+(o.sites||[]).length)}catch(err){toast(t("importFail"))}}); el.value=""; return}
});
